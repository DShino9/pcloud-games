<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊ぶ</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="./core/shelf.css?v=1">
<style>
html,body{overflow:hidden;background:#000}
#wrap{position:absolute;inset:0}
#game{width:100%;height:100%}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center;background:#000;z-index:5}
#load.hide{display:none}
#load h2{margin:0;font-size:16px;font-weight:600}
#bar{width:min(320px,78vw);height:6px;border-radius:3px;background:#22222b;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#err{color:var(--danger);font-size:13px;max-width:420px;line-height:1.7}
</style>
</head>
<body>
<div id="wrap"><div id="game"></div></div>
<div id="load">
  <h2 id="nm">読み込んでいます</h2>
  <div id="bar"><i></i></div>
  <div class="msg" id="st">棚から取り寄せています…</div>
  <div id="err"></div>
</div>
<script src="./core/pcloud.js?v=2"></script>
<script>
'use strict';

/* 動きを測る。EmulatorJS は自分の中で絵を出すので、
   WebGL の描画回数を数えて「毎秒何コマ出ているか」を見る。
   iPhone で重いと言われたとき、憶測でなく数字で当たれるように。 */
let DRAWS = 0, GAPS = [], LONG = 0, LASTDRAW = 0;
const T0 = Date.now();
(function () {
  for (const C of [window.WebGL2RenderingContext, window.WebGLRenderingContext]) {
    if (!C) continue;
    for (const fn of ['drawArrays', 'drawElements']) {
      const d = C.prototype[fn];
      if (!d) continue;
      C.prototype[fn] = function () {
        if (fn === 'drawArrays') {
          DRAWS++;
          const t = performance.now();
          if (LASTDRAW) {
            const dt = t - LASTDRAW;
            GAPS.push(dt); if (GAPS.length > 900) GAPS.shift();
            if (dt > 100) LONG++;
          }
          LASTDRAW = t;
        }
        return d.apply(this, arguments);
      };
    }
  }
})();
/* 10秒ごとの並び。**平均は揺れを打ち消す。**
   「出だしは良く、途中から重くなる」も「速くなったり重くなったり」も、
   通しの平均では 1つの数字に潰れて見えない。刻んで残す。 */
const TL = [];
let TLLAST = 0;
setInterval(() => {
  TL.push(Math.round((DRAWS - TLLAST) / 10));
  TLLAST = DRAWS;
  if (TL.length > 60) TL.shift();      // 10分ぶん
}, 10000);
function jitter() {
  if (GAPS.length < 8) return null;
  const a = GAPS.slice().sort((x, y) => x - y);
  const q = f => a[Math.min(a.length - 1, Math.floor(a.length * f))];
  const mid = q(0.5);
  return { mid: +mid.toFixed(1), p95: +q(0.95).toFixed(1), max: +a[a.length - 1].toFixed(1),
           long: LONG, rough: +(a.filter(x => x > mid * 2).length / a.length * 100).toFixed(1) };
}
/* 遊ぶ画面。棚とは別の文書にしてある。
   EmulatorJS は同じ文書の中で作り直すのが難しく、前のコアが残ると音だけ鳴り続ける。
   1本につき1文書にすれば、閉じた時点（iframe を about:blank にした時点）で確実に止まる。 */

const P   = window.PCloud;
let GAME = null;
const LS  = P.store('pg');
const ROMS = P.shelfCache('roms-v1', 'rom.local');
const $   = s => document.querySelector(s);
const qs  = new URLSearchParams(location.search);
const id  = qs.get('id');
const fid = qs.get('fid');

/* どこまで進んだか。止まったときに**これを画面に出す**（#85）。 */
let STAGE = '始め';

const say = t => { $('#st').textContent = t; };
const bar = p => { $('#bar i').style.width = Math.max(0, Math.min(100, p)) + '%'; };
function fail(msg) { $('#bar').style.display = 'none'; say(''); $('#err').innerHTML = msg; failBeacon(msg); }
/* **しくじりの、のろし。** 画面の文言を写してもらわなくても、
   何で止まったかを倉庫の _記録 に送っておき、Mac 側から読めるようにする。 */
let BEACONED = false;
async function failBeacon(msg) {
  if (BEACONED) return;
  BEACONED = true;
  try {
    const g = k => { try { return JSON.parse(localStorage.getItem('pg.' + k)); } catch (e) { return null; } };
    const auth = g('auth'), rootId = g('rootId'), host = g('host') || 'api.pcloud.com';
    if (!auth || !rootId) return;
    const fid = await P.ensureFolder(rootId, '_記録', { host, auth });
    const body = JSON.stringify({
      at: new Date().toISOString(), 画面: location.pathname + '?' + location.search.slice(1, 90),
      ua: navigator.userAgent.slice(0, 160), msg: String(msg).slice(0, 400) });
    await P.uploadFile(fid, 'しくじり-' + Date.now() + '.json',
      new Blob([body], { type: 'application/json' }), { host, auth });
  } catch (e) {}
}


/* 大きい控え（台帳・fileid表）は Cache API に移った（v118）。
   ここも同じ置き場を読む —— localStorage だけ見ていると、
   引っ越し後の端末で「台帳にありません」「BIOS が無い」になる（実際になった）。 */
async function bigGet(k, d) {
  try {
    const c = await caches.open('pg-big-v1');
    const r = await c.match('/big/' + encodeURIComponent(k));
    if (r) return await r.json();
  } catch (e) {}
  try { const v = localStorage.getItem('pg.' + k); if (v != null) return JSON.parse(v); } catch (e) {}
  return d;
}
(async function start() {
  if (!id || !fid) return fail('どの本かが分かりません');
  let cat;
  try { cat = await (await fetch('./games.json?v=1', { cache: 'no-cache' })).json(); }
  catch (e) { return fail('台帳が読めません'); }
  /* 台帳に無い本は、棚が見つけて端末に足した分（`pg.extra`）から引く。
     台帳は Mac の中身から作ったものなので、pCloud にしか無い本は載っていない。 */
  let g = (cat.games || []).find(x => x.id === id);
  if (!g) {
    try {
      const e = (await bigGet('extra', [])).find(x => x.id === id);
      if (e) g = { ...e, file: e.files[0] };
    } catch (err) {}
  }
  if (!g)      return fail('台帳にありません');
  if (!g.core) return fail(g.system + ' はブラウザでは動きません');
  GAME = g;
  $('#nm').textContent = g.name;
  document.title = g.name;

  let blob = null;
  const hit = await ROMS.get(id);
  if (hit) { blob = await hit.blob(); say('棚にありました'); bar(100); }
  else {
    /* 入口（ds9）の下では、中継所は入口の中に同居している。設定させない。
         ここは棚の一覧とは別のページなので、同じ判断を自前で持つ必要がある。 */
      const relay = /(^|\.)github\.io$/.test(location.hostname)
        ? (LS.get('relay', '') || 'https://gamedana.d-shino.workers.dev')
        : location.origin + '/relay';
    const host = LS.get('host', P.HOSTS[0]);
    const auth = LS.get('auth', '');
    const tell = (got, len) => {
      bar(got / len * 100);
      say(Math.round(got / 1e3).toLocaleString() + ' / ' + Math.round(len / 1e3).toLocaleString() + ' KB');
    };
    try {
      /* fetchFile が道を順に降りる：中継所の直リンク → 公開リンク → 中継所なし。
         中継所が未設定でも落ちていても、遅くなるだけで遊べる。
         ROM は元々まるごと読んでから起こすので、頭出しが効かない不利は無い。 */
      if (!relay) say('中継所なしで取り寄せます。少し待ってください…');
      STAGE = 'ROM の取り寄せ';
      blob = await P.fetchFile(relay, { fileid: fid, host, auth }, tell, g.bytes);
    } catch (e) { return fail('取り寄せられません: ' + e.message); }
    /* 一度取れたら手元に置く。次からは圏外でも遊べる。 */
    await ROMS.put(id, blob.slice(), { 'x-name': encodeURIComponent(g.file) });
  }

  /* **ネオジオは BIOS を一緒に渡さないと起動しない（#89）。**
     `neogeo.zip`（倉庫の `アーケード/Arcade/bios/`）を取り寄せて EmulatorJS に渡す。
     取れなければ**黙って諦めず**、その旨を出してから素のまま起こす。 */
  let biosFile = null;
  if (g.short === 'NEO') {
    try {
      STAGE = 'BIOS の取り寄せ';
      say('ネオジオの BIOS を取り寄せています…');
      const files = LS.get('files', {});
      const bid = files['neogeo.zip'] || files['NEOGEO.ZIP'];
      if (!bid) throw new Error('倉庫に neogeo.zip が見つかりません');
      const relay2 = /(^|\.)github\.io$/.test(location.hostname)
        ? (LS.get('relay', '') || 'https://gamedana.d-shino.workers.dev')
        : location.origin + '/relay';
      const b = await P.fetchFile(relay2, { fileid: bid,
        host: LS.get('host', P.HOSTS[0]), auth: LS.get('auth', '') });
      biosFile = new File([b], 'neogeo.zip', { type: 'application/octet-stream' });
    } catch (e) {
      say('BIOS を取り寄せられません（' + e.message + '）。そのまま起こします…');
    }
  }

  say('コアを起こしています…');
  bar(100);
  STAGE = 'コアの読み込み';

  window.EJS_player      = '#game';
  window.EJS_core        = g.core;
  /* blob の URL で渡すと拡張子が消える。EmulatorJS はそこから中身の種類を決めるので、
     .nes / .smc が分からず灰色のまま止まる。File にして名前ごと渡す。
     （EmulatorJS は gameUrl が File なら、読み込んだ後に名前へ差し替える造りになっている） */
  window.EJS_gameUrl     = new File([blob], g.file, { type: 'application/octet-stream' });
  window.EJS_gameName    = g.name;
  window.EJS_gameID      = g.id;      // セーブの分かれ目
  window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';
  if (biosFile) window.EJS_biosUrl = biosFile;
  /* **中で一度押させる（#85）。**
     iPad・iPhone の Safari は、**その文書の中で指が触れるまで音を鳴らさない。**
     遊ぶ画面は iframe の中にあり、押されたのは外側の棚なので、
     この文書は「一度も触られていない」扱いになる。
     EmulatorJS はコアの輪を音の器に合わせて回すので、器が止まったままだと
     **絵も出ない —— 黒いまま・灰色のまま**（2026-09-14 本人の iPad で確認）。
     Mac と Android で動いていたのは、あちらが指を要求しないから。
     自動で始めるのをやめ、EmulatorJS 自身の開始画面を出す。
     そこを押せばこの文書が触られたことになり、音も絵も起きる。 */
  window.EJS_startOnLoaded = false;
  /* 日本語の言語ファイルは配られていない（ja-JP も ja も 404）。
     指定すると毎回 404 を出しに行くので、指定しない。 */
  window.EJS_color       = '#6ea8fe';
  /* 軽くするための既定。触って重い端末（iPhone）で効く。
     利用者が本体の設定で変えれば、そちらが優先される。 */
  window.EJS_defaultOptions = {
    shader: 'disabled',          // 画面の飾りを掛けない
    rewindEnabled: 'disabled',   // 巻き戻しは常に記録し続けるので高くつく
    vsync: 'enabled',            // 画面の更新に合わせる（出しすぎない）
  };
  /* 開始画面が出たら覆いを外す（ここから先は EmulatorJS の画面）。 */
  window.EJS_ready       = () => { STAGE = '開始待ち'; $('#load').classList.add('hide'); };
  window.EJS_onGameStart = () => {
    STAGE = '動いている'; $('#load').classList.add('hide');
    setTimeout(touchBridge, 1200);
  };

  /* ---- ニンテンドーDS の**タッチ画面**（2026-09-15） ----
   **EmulatorJS は指をコアに渡していない。** 絵の上に置いているのは自前の
   十字キー・ボタンだけで、画面そのものへの指は拾わない。コア（melonDS）は
   **マウスの出来事しか知らない**ので、机の上ではクリックで触れるのに、
   iPad では**タッチ画面が一切効かない**（本人・2026-09-15）。

   PC-98 と同じ考え方で、**指をマウスに訳して絵へ渡す。**
   訳すのは**タッチ画面を持つ機種だけ**（ほかの機種で `preventDefault` を
   掛けると、EmulatorJS 自身の合図＝下から出すメニューなどを塞いでしまう）。 */
  const NEEDS_POINTER = new Set(['melonds', 'desmume', 'desmume2015']);
  function touchBridge() {
    try {
      if (!(matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window)) return;
      if (!NEEDS_POINTER.has(String(g.core || '').toLowerCase())) return;
      const cv = document.querySelector('#game canvas');
      if (!cv || cv.dataset.tbridge) return;
      cv.dataset.tbridge = '1';
      const send = (type, t, held) => cv.dispatchEvent(new MouseEvent(type, {
        clientX: t.clientX, clientY: t.clientY, button: 0,
        buttons: held ? 1 : 0, bubbles: true, cancelable: true, view: window,
      }));
      const opt = { passive: false };
      let id = null;
      cv.addEventListener('touchstart', e => {
        if (id !== null) return;                    /* 1本目の指だけ見る */
        const t = e.changedTouches[0];
        id = t.identifier;
        /* **置く前に一度そこへ動かす。** いきなり押すと、前に居た場所で
           押したことになる本がある（DS の下画面は位置がすべて）。 */
        send('mousemove', t, false);
        send('mousedown', t, true);
        e.preventDefault();
      }, opt);
      cv.addEventListener('touchmove', e => {
        const t = [...e.changedTouches].find(x => x.identifier === id);
        if (!t) return;
        send('mousemove', t, true);
        e.preventDefault();
      }, opt);
      const end = e => {
        const t = [...e.changedTouches].find(x => x.identifier === id);
        if (!t) return;
        send('mouseup', t, false);
        id = null;
        e.preventDefault();
      };
      cv.addEventListener('touchend', end, opt);
      cv.addEventListener('touchcancel', end, opt);
      try { LS.set('log', (LS.get('log', []) || []).concat('指をタッチ画面に訳した: ' + g.core).slice(-20)); } catch (e2) {}
    } catch (e) {}
  }

  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror = () => fail('コアを取ってこられません（cdn.emulatorjs.org につながらない）');
  document.body.appendChild(s);
  /* **黙って黒いままにしない（#85）。**
     前はここで「絵の器があれば覆いを外す」だけをしていた。器は EmulatorJS が
     先に作るので、**中身が一度も動いていなくても覆いが外れ、黒い画面だけが残った。**
     何で止まったのか、画面にもログにも出ないので、こちらから読めなかった。
     いまはどこまで進んだかを見て、進んでいなければ**その場で言う**。 */
  let waited = 0;
  const watch = setInterval(() => {
    waited += 500;
    if (STAGE === '動いている') return clearInterval(watch);
    /* EmulatorJS が自分の画面（開始の三角・帯・絵の器）を出したら、覆いを外す。
       `EJS_ready` が来ない版があるので、目に見えるもので判断する。 */
    if ($('#game').children.length) {
      STAGE = '開始待ち';
      $('#load').classList.add('hide');
      return;
    }
    if (waited < 30000) return;
    clearInterval(watch);
    $('#load').classList.remove('hide');
    fail('コアが起きません（' + esc(STAGE) + 'で止まりました）<br>'
       + esc(g.core) + ' ／ ' + esc(navigator.userAgent.slice(0, 80)) + '<br>'
       + 'つなぎを確かめるか、別の本で試してください');
  }, 500);
})();
function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

/* 落ちたときに残す証拠。
   **落ちると pagehide は来ない。** iOS が重さでページを畳むと、
   その場で消えるので何も残らない。だから5秒ごとに書き続け、
   ちゃんと閉じたときだけ「終わった」印を付ける。
   印の無い記録＝**途中で切れた**＝落ちた、と読める。 */
let ERR = '';
/* **しくじりを画面にも出す（#85）。** 溜めるだけでは、動いていない端末の前に
   いる人には何も分からない。まだ始まっていないうちのしくじりは、
   そのまま止まる理由なので、覆いを戻して見せ、のろしも上げる。 */
function caught(msg) {
  ERR = ERR || msg;
  saveRun(false);
  if (STAGE === '動いている') return;
  const ld = document.querySelector('#load');
  if (ld) ld.classList.remove('hide');
  fail(esc(msg));
}
addEventListener('error', e => caught(
  'しくじり: ' + (e.message || '') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || '')));
addEventListener('unhandledrejection', e => caught(
  '待ちしくじり: ' + ((e.reason && e.reason.message) || e.reason || '')));
setInterval(() => saveRun(false), 5000);

/* 動きの記録。棚の「設定 → 動きの記録」から読める。端末ごとの比較に使う。
   done=false は書きかけ（同じ回を上書きしていく）。 */
const RUNID = 'r' + T0;
function saveRun(done = true) {
  try {
    const sec = Math.max(1, (Date.now() - T0) / 1000);
    if (sec < 5 || !GAME) return;
    const runs = LS.get('runs', []).filter(r => r.rid !== RUNID);   // 同じ回は上書き
    runs.unshift({
      rid: RUNID, done, err: ERR,
      at: new Date().toISOString().slice(0, 16).replace('T', ' '),
      name: GAME.name, core: GAME.core,
      fps: +(DRAWS / sec).toFixed(1), loop: 0, sec: Math.round(sec),
      j: jitter(), tl: TL.slice(), rate: 0,
      cpu: navigator.hardwareConcurrency || 0,
      mem: navigator.deviceMemory || 0,
      ua: (navigator.userAgent.match(/(CriOS|Chrome|Firefox|Version|Edg)\/[\d.]+/) || ['?'])[0],
      os: (navigator.userAgent.match(/\((.*?)\)/) || ['', '?'])[1].slice(0, 40),
      px: screen.width + '×' + screen.height + '@' + (window.devicePixelRatio || 1),
    });
    LS.set('runs', runs.slice(0, 10));
  } catch (e) {}
}
addEventListener('pagehide', () => saveRun(true));
addEventListener('visibilitychange', () => { if (document.hidden) saveRun(true); });
</script>
</body>
</html>
