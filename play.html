<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊ぶ</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="./core/shelf.css?v=1">
<style>
html,body{overflow:hidden;background:#000}
#wrap{position:absolute;inset:0}
#game{width:100%;height:100%}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:24px;text-align:center;background:#000;z-index:5}
#load.hide{display:none}
#load h2{margin:0;font-size:16px;font-weight:600}
#bar{width:min(320px,78vw);height:6px;border-radius:3px;background:#22222b;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#err{color:var(--danger);font-size:13px;max-width:420px;line-height:1.7}
</style>
</head>
<body>
<div id="wrap"><div id="game"></div></div>
<div id="load">
  <h2 id="nm">読み込んでいます</h2>
  <div id="bar"><i></i></div>
  <div class="msg" id="st">棚から取り寄せています…</div>
  <div id="err"></div>
</div>
<script src="./core/pcloud.js?v=1"></script>
<script>
'use strict';
/* 遊ぶ画面。棚とは別の文書にしてある。
   EmulatorJS は同じ文書の中で作り直すのが難しく、前の心臓が残ると音だけ鳴り続ける。
   1本につき1文書にすれば、閉じた時点（iframe を about:blank にした時点）で確実に止まる。 */

const P   = window.PCloud;
const LS  = P.store('pg');
const ROMS = P.shelfCache('roms-v1', 'rom.local');
const $   = s => document.querySelector(s);
const qs  = new URLSearchParams(location.search);
const id  = qs.get('id');
const fid = qs.get('fid');

const say = t => { $('#st').textContent = t; };
const bar = p => { $('#bar i').style.width = Math.max(0, Math.min(100, p)) + '%'; };
function fail(msg) { $('#bar').style.display = 'none'; say(''); $('#err').innerHTML = msg; }

(async function start() {
  if (!id || !fid) return fail('どの本かが分かりません');
  let cat;
  try { cat = await (await fetch('./games.json?v=1', { cache: 'no-cache' })).json(); }
  catch (e) { return fail('台帳が読めません'); }
  const g = (cat.games || []).find(x => x.id === id);
  if (!g)      return fail('台帳にありません');
  if (!g.core) return fail(g.system + ' はブラウザでは動きません');
  $('#nm').textContent = g.name;
  document.title = g.name;

  let blob = null;
  const hit = await ROMS.get(id);
  if (hit) { blob = await hit.blob(); say('手元にありました'); bar(100); }
  else {
    const relay = LS.get('relay', '');
    const host = LS.get('host', P.HOSTS[0]);
    const auth = LS.get('auth', '');
    const tell = (got, len) => {
      bar(got / len * 100);
      say(Math.round(got / 1e3).toLocaleString() + ' / ' + Math.round(len / 1e3).toLocaleString() + ' KB');
    };
    try {
      if (relay) {
        /* 直リンクで渡してもらえないものがある。そのときは公開リンク経由に降りる。 */
        blob = await P.fetchFile(relay, { fileid: fid, host, auth }, tell, g.bytes);
      } else {
        /* pCloud の配信元は CORS を返さないので、中継所なしでは中身を掴めない。
           api ホストの file_open は CORS が開いているが 2003 で使えなかった（実測）。 */
        return fail('中継所が要ります。<br>棚の「設定 → 中継所」を開いて、' +
                    'ゲーム棚用の中継所を1台立ててください（手順はその画面に書いてあります）。');
      }
    } catch (e) { return fail('取り寄せられません: ' + e.message); }
    /* 一度取れたら手元に置く。次からは圏外でも遊べる。 */
    await ROMS.put(id, blob.slice(), { 'x-name': encodeURIComponent(g.file) });
  }

  say('心臓を起こしています…');
  bar(100);

  window.EJS_player      = '#game';
  window.EJS_core        = g.core;
  /* blob の URL で渡すと拡張子が消える。EmulatorJS はそこから中身の種類を決めるので、
     .nes / .smc が分からず灰色のまま止まる。File にして名前ごと渡す。
     （EmulatorJS は gameUrl が File なら、読み込んだ後に名前へ差し替える造りになっている） */
  window.EJS_gameUrl     = new File([blob], g.file, { type: 'application/octet-stream' });
  window.EJS_gameName    = g.name;
  window.EJS_gameID      = g.id;      // セーブの分かれ目
  window.EJS_pathtodata  = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  /* 日本語の言語ファイルは配られていない（ja-JP も ja も 404）。
     指定すると毎回 404 を出しに行くので、指定しない。 */
  window.EJS_color       = '#6ea8fe';
  window.EJS_onGameStart = () => { $('#load').classList.add('hide'); };

  const s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror = () => fail('心臓を取ってこられません（cdn.emulatorjs.org につながらない）');
  document.body.appendChild(s);
  /* 起動の合図が来ないことがある。少し待って画面が出ていれば覆いを外す。 */
  setTimeout(() => { if (document.querySelector('#game canvas')) $('#load').classList.add('hide'); }, 8000);
})();
</script>
</body>
</html>
