<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゲーム棚</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゲーム棚">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<!-- 共通の見た目。正本は ~/claude code/shelf-core/shelf.css -->
<link rel="stylesheet" href="./core/shelf.css?v=2">
<style>
/* 本の頁。大きな箱絵と、その本にまつわる操作を1か所に。 */
.tpage{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.tcov{flex:0 0 260px;max-width:100%;border-radius:12px;overflow:hidden;
  background:#000;border:1px solid var(--line)}
.tcov img{width:100%;display:block}
.tcov .ph{padding:60px 14px;text-align:center;color:var(--dim);font-size:14px}
.tbody{flex:1 1 320px;min-width:0}
.tbody h2{margin:0 0 8px;font-size:22px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)}
.tmeta .tag{position:static;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;
  color:#fff;background:rgba(255,255,255,.12)}
.tacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tacts .primary{padding:10px 22px;font-size:15px}
@media (max-width:560px){.tcov{flex:0 0 100%}}
/* 選ぶ画面（#74）。3列: レール／一覧／選んだ本の札。 */
.l2wrap{display:flex;gap:0;align-items:stretch;min-height:calc(100dvh - 90px)}
.l2rail{flex:0 0 210px;border-right:1px solid var(--line);padding:4px 10px 20px 0;
  overflow-y:auto;max-height:calc(100dvh - 90px);position:sticky;top:0}
.l2h{font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:.14em;margin:6px 0 2px 8px}
.l2sys,.l2mk,.l2grp{display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  background:none;border:0;color:var(--dim);cursor:pointer;font-size:13.5px;
  padding:6px 8px;border-radius:8px}
.l2sys:hover,.l2mk:hover{background:rgba(255,255,255,.05)}
.l2sys.on{background:rgba(255,255,255,.08);color:var(--fg);font-weight:650}
.l2sys .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2sys .c,.l2mk .c{margin-left:auto;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
.l2sys .tri,.l2grp .tri{width:10px;font-size:9px;color:var(--dim2)}
.l2sub{margin:0 0 4px 14px;padding-left:8px;border-left:2px solid var(--line)}
.l2grp{font-size:10.5px;color:var(--dim2);letter-spacing:.12em;padding:5px 8px 2px}
.l2grp:hover{color:var(--dim)}
.l2mk{font-size:13px;padding:4px 8px}
.l2mk.on{color:var(--accent);font-weight:700}
.l2foot{margin:14px 0 0 8px;font-size:11px;color:var(--dim2);line-height:1.7}
.l2main{flex:1;min-width:0;padding:0 14px}
.l2crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--dim);
  padding:2px 0 8px}
.l2crumbs span{color:var(--dim2)}
.l2crumbs b{color:var(--fg)}
.item.sel .cov{outline:2px solid var(--accent);outline-offset:1px;border-radius:10px}
.l2rows{display:flex;flex-direction:column}
.l2r{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-bottom:1px solid var(--line);color:var(--fg);cursor:pointer;
  padding:6px 6px;font-size:13.5px}
.l2r:hover{background:rgba(255,255,255,.04)}
.l2r.sel{background:rgba(255,255,255,.08)}
.l2r .rc{flex:0 0 30px;height:40px;border-radius:4px;overflow:hidden;background:#000}
.l2r .rc img{width:100%;height:100%;object-fit:cover;display:block}
.l2r .rn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2r .rs{color:var(--dim2);font-size:11.5px;white-space:nowrap}
.l2side{flex:0 0 270px;border-left:1px solid var(--line);padding:8px 0 30px 14px;
  overflow-y:auto;max-height:calc(100dvh - 90px);position:sticky;top:0}
.l2none{color:var(--dim2);font-size:13px;text-align:center;padding-top:60px;line-height:2}
.l2cov{max-width:170px;margin:0 auto;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:#000}
.l2cov img{width:100%;display:block}
.l2cov .ph{padding:50px 10px;text-align:center;color:var(--dim);font-size:13px}
.l2t{font-size:18px;font-weight:750;line-height:1.4;margin:10px 0 2px;text-wrap:balance}
.l2m{font-size:12px;color:var(--dim);margin-bottom:8px}
.l2state{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);
  color:var(--dim);background:none}
.chip.shelf{color:var(--ok);border-color:var(--ok)}
.chip.away{color:var(--danger);border-color:var(--danger)}
.chip.dashed{border-style:dashed;cursor:pointer;color:var(--accent);border-color:var(--accent)}
.l2play{width:100%;padding:11px 0;font-size:15px;margin:2px 0 8px}
.l2play:disabled{opacity:.35;cursor:default}
.l2acts{display:flex;gap:8px;flex-wrap:wrap}
.l2acts .hbtn{flex:1;text-align:center}
.l2sec{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.l2sec h3{font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:.12em;margin:0 0 6px}
.l2ver{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;color:var(--dim);cursor:pointer}
.l2disk{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}
.l2disk .dk{flex:0 0 64px;font-size:10.5px;text-align:center;color:var(--accent);
  border:1px solid var(--line);border-radius:4px}
.l2kv{display:flex;gap:8px;font-size:12px;padding:2px 0;color:var(--dim)}
.l2kv code{word-break:break-all;font-size:11px;color:var(--dim2)}
.sheetbar{display:none}
@media (max-width:920px){
  .l2wrap{display:block;min-height:0}
  .l2rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);
    display:flex;overflow-x:auto;overflow-y:hidden;gap:4px;align-items:center;
    padding:6px 0;scrollbar-width:none;flex:none}
  .l2h,.l2foot{display:none}
  .l2sys{flex:none;border:1px solid var(--line);border-radius:16px;padding:4px 12px;width:auto}
  .l2sys .tri{display:none}
  .l2sub{display:flex;flex:none;border:0;margin:0;padding:0;gap:4px}
  .l2mk{flex:none;border:1px dashed var(--line);border-radius:16px;padding:4px 12px;width:auto}
  .l2grp{flex:none;width:auto;padding:4px 2px 4px 6px}
  .l2main{padding:8px 0 0}
  .l2side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;flex:none;max-height:72vh;
    background:var(--bg2,var(--bg));border-left:0;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;padding:10px 16px 30px;
    transform:translateY(105%);transition:transform .2s ease;
    box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  .l2side.open{transform:none}
  .sheetbar{display:block;width:44px;height:4px;border-radius:2px;background:var(--line);
    margin:0 auto 10px}
  .l2cov{max-width:110px}
}
@media (prefers-reduced-motion:reduce){.l2side{transition:none}}
/* 掘っている場所の道しるべ。 */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;font-size:13px}
.crumb button{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;font-size:13px}
.crumb button:hover{text-decoration:underline}
.crumb span{color:var(--dim2)}
/* 版の数。札の隅に小さく。 */
.item .vers{display:inline-block;margin-left:6px;font-size:10px;padding:1px 5px;
  border-radius:5px;background:rgba(255,255,255,.10);color:var(--dim)}
/* 選ばせる覆い。 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;padding:16px}
.sheetbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;max-width:520px;width:100%;max-height:80vh;overflow:auto}
/* 3つの見方の札。耳読の書棚と同じ作り —— 名前と数が並び、いま見ているものが塗られる。
   説明文をいくら足すより、これ1つのほうが分かる。 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  flex:0 0 auto;order:-1;position:sticky;left:0;z-index:3;background:var(--bg)}
.seg button{border:0;background:none;color:var(--dim);font-size:12.5px;
  padding:7px 12px;cursor:pointer;white-space:nowrap;
  border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.seg button.on{background:var(--accent);color:#0b0c10;font-weight:650}
/* 入口の機種札。**箱絵を敷いて、その上にロゴ。**
   字だけの一覧では「どの機種に何があるか」が伝わらない。 */
.sysgrid{display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.sysc{position:relative;padding:0;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;background:var(--card);cursor:pointer;text-align:left;
  display:flex;flex-direction:column;min-height:118px}
.sysc:hover{border-color:var(--accent)}
.syscov{position:absolute;inset:0}
.syscov img{width:100%;height:100%;object-fit:cover;opacity:.30;filter:saturate(.85)}
.syscov i{position:absolute;inset:0;
  background:linear-gradient(rgba(10,11,14,.30),rgba(10,11,14,.88))}
.syshead{position:relative;padding:12px 13px 0;display:flex;align-items:center;gap:8px;
  min-height:44px}
.syslogo{height:26px;max-width:120px;object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,1))}
.systag{font-size:15px;font-weight:700;letter-spacing:.05em;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,1)}
.sysname{margin-left:auto;font-size:11px;color:var(--dim2)}
.syscnt{position:relative;margin-top:auto;padding:0 13px 12px;font-size:13px;color:var(--fg)}
/* 機種の色を左端に細く敷く。一覧の中で拾いやすくなる。 */
.sysc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--sys,var(--line))}
.sysc[data-s="FC"] {--sys:#c8392b} .sysc[data-s="SFC"]{--sys:#5b5f9e}
.sysc[data-s="N64"]{--sys:#1f8a63} .sysc[data-s="DS"] {--sys:#6b7280}
.sysc[data-s="PSP"]{--sys:#4b3a72} .sysc[data-s="98"] {--sys:#1d5c8f}
.sysc[data-s="MD"] {--sys:#1f6fb0} .sysc[data-s="PCE"]{--sys:#c07a1f}
.sysc[data-s="GB"] {--sys:#5a7a3a} .sysc[data-s="GBA"]{--sys:#4a3f8f}
@media (max-width:520px){.sysgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
/* 束の見出し。押すと畳む。数が増えると一覧が長くなるので、
   ふだん見ない機種は畳んだままにしておける（耳読の書棚と同じ作法）。 */
h2.fold{display:flex;align-items:center;gap:8px;margin:18px 0 10px;cursor:pointer;
  font-size:15px;font-weight:650;color:var(--fg);user-select:none}
h2.fold:first-child{margin-top:4px}
h2.fold .tri{color:var(--dim2);font-size:12px;width:12px}
h2.fold .cnt{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim2)}
h2.fold:hover .tri{color:var(--accent)}
/* **`hidden` だけでは畳めない。** `.grid{display:grid}` のほうが強くて
   ブラウザ既定の `display:none` を押し返す。ここで明示的に消す。 */
.grid[hidden]{display:none}
[data-body][hidden]{display:none}
/* 畳む見出しは一覧の中でも使う。行の束は `.rowlist`。 */
.rowlist[hidden]{display:none}
.card h2.fold{margin:14px 0 8px;font-size:14px}
/* フォルダの木。倉庫の整理をそのまま出す。 */
.tree{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tnode{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.trow{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:none;border:0;color:var(--fg);font-size:13.5px;cursor:pointer;text-align:left}
.trow:hover{background:rgba(255,255,255,.04)}
.trow .tri{color:var(--dim2);font-size:11px;width:11px;flex:0 0 11px}
.trow .tname{font-weight:600}
.trow .cnt{margin-left:auto;font-size:12px;font-weight:400;color:var(--dim2)}
.tsel{flex:0 0 auto;margin-right:8px;font-size:11px}
/* 版はいつも見える所に。設定の奥に置いたら「どこに表示?」と聞かせてしまった。 */
#hver{margin-left:auto;font-size:11px;color:var(--dim2);letter-spacing:.04em}
.tree .row{border-bottom:1px solid var(--line)}
/* 機種の見分け。**小さい灰色の札では、並べたときに読めない。**
   機種ごとに色を決め、字も大きくする。色は「その機械の顔」に寄せた:
   ファミコンは赤白、スーファミは灰に四色、64 は青緑、DS は銀青、
   PSP は黒紫、PC-98 は NEC の青。 */
.cov .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;
  padding:3px 7px;color:#fff;background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:4px;line-height:1}
/* ロゴには**枠を付けない。** 札にすると絵の上で四角が目立ちすぎて、
   箱絵より先に目に入る。白抜きのロゴを直に置き、影だけで浮かせる。
   絵の上辺に薄く影を敷けば、明るい箱の上でも読める。 */
.cov .tag.logo{background:none;border:0;padding:0;left:8px;top:7px;z-index:2}
.cov .tag.logo span{display:none}
.cov .tag.logo img{height:22px;max-width:94px;object-fit:contain;display:block;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,1)) drop-shadow(0 0 9px rgba(0,0,0,.75))}
.cov::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
/* 狭い画面では札も絵も小さくなるので、ロゴだけ大きいと絵を隠す。少し詰める。 */
@media (max-width:520px){.cov .tag.logo img{height:17px;max-width:74px}}
.cov .tag[data-s="FC"] {background:#c8392b;border-color:#e8695c}
.cov .tag[data-s="SFC"]{background:#5b5f9e;border-color:#8b8fd0}
.cov .tag[data-s="N64"]{background:#1f8a63;border-color:#4fc493}
.cov .tag[data-s="DS"] {background:#6b7280;border-color:#9ca3af}
.cov .tag[data-s="PSP"]{background:#4b3a72;border-color:#7d68ad}
.cov .tag[data-s="98"] {background:#1d5c8f;border-color:#4d92c9}
/* 絵の下辺にも同じ色を薄く敷く。札が絵に紛れても、並びの中で機種が拾える。 */
.cov{position:relative}
.cov::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:var(--sys,transparent)}
.item[data-s="FC"]  .cov{--sys:#c8392b}
.item[data-s="SFC"] .cov{--sys:#5b5f9e}
.item[data-s="N64"] .cov{--sys:#1f8a63}
.item[data-s="DS"]  .cov{--sys:#6b7280}
.item[data-s="PSP"] .cov{--sys:#4b3a72}
.item[data-s="98"]  .cov{--sys:#1d5c8f}
/* ここはゲーム棚だけの飾り。共通に効かせたいものは shelf-core/shelf.css へ。 */

/* 箱絵は縦長。正方形に切ると題字が落ちるので、比率のまま収める。 */
body{--ratio:3/4; --fit:contain}

/* 遊ぶ画面。棚の上に覆いかぶせる。 */
/* iOS の Safari は動画以外を全画面にできない（Fullscreen API が無い）。
   そこでは代わりに「できるだけ広く」＝上の帯を畳んで、絵に全部渡す。
   dvh を使うのは、iOS の URL 欄の出入りで高さが変わるため。 */
#play{position:fixed;inset:0;height:100dvh;z-index:80;background:#000;
  display:flex;flex-direction:column}
#play.wide .top{display:none}
#play.wide .back{display:flex}
.back{display:none;position:absolute;left:max(8px, env(safe-area-inset-left));
  top:max(8px, env(safe-area-inset-top));z-index:90;
  width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;
  background:rgba(12,12,16,.55);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px}
/* 横持ちのとき、ノッチとホームバーの側に余白が要る。
   縦の safe-area しか見ていなかったので、ボタンが画面の外へ出ていた。 */
#play .top{height:calc(var(--top) + 40px);padding-top:var(--top);flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding-left:max(10px, env(safe-area-inset-left));
  padding-right:max(10px, env(safe-area-inset-right));
  background:#0b0b0f;border-bottom:1px solid var(--line)}
#play .top .nm{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#play iframe{flex:1;width:100%;border:0;display:block;background:#000}
/* 全画面のときは上の帯を薄くして、絵に場所を譲る。触れば戻る。 */
#play:fullscreen .top{height:34px;padding-top:0;opacity:.25;transition:opacity .2s}
#play:fullscreen .top:hover{opacity:1}
</style>
</head>
<body>
<header>
  <h1 id="title">ゲーム棚</h1>
  <button class="hbtn" id="hback" title="一つ上へ">←</button>
  <button class="hbtn" id="hhome" title="棚のトップへ">棚</button>
  <span id="hver" title="いま動いている版"></span>
  <button class="hbtn hide" id="hcell">中</button>
  <button class="hbtn" id="hset">設定</button>
</header>
<main id="main"></main>
<div id="play" class="hide">
  <div class="top">
    <button class="hbtn" id="pclose">閉じる</button>
    <span class="nm" id="pname"></span>
    <button class="hbtn" id="pfull">全画面</button>
  </div>
  <button class="back" id="pback" title="帯を出す">▾</button>
  <iframe id="pframe" allow="autoplay; gamepad; fullscreen" allowfullscreen></iframe>
</div>
<div id="toast"></div>
<script src="./core/pcloud.js?v=6"></script>
<script src="./makers.js?v=1"></script>
<script src="./pc98disk.js?v=3"></script>
<script src="./title.js?v=1"></script>
<script src="./disks.js?v=3"></script>
<script src="./app.js?v=106"></script>
<script src="./lib2.js?v=3"></script>
<script src="./state2.js?v=2"></script>
</body>
</html>
